# Este archivo solo levanta la DB para desarrollo local con IntelliJ
services:
  postgres:
    image: postgres:latest
    container_name: web-db-local
    environment:
      POSTGRES_DB: web_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-local:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d web_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: web-db-adminer-local
    ports:
      - "8888:8080"
    depends_on:
      - postgres

volumes:
  postgres-data-local: