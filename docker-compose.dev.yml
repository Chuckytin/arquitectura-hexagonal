services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env.dev
    environment:
      SPRING_PROFILES_ACTIVE: dev

  postgres:
    env_file:
      - .env.dev
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
    volumes:
      - postgres-data-dev:/var/lib/postgresql
      - ./docker-config/database/init.sh:/docker-entrypoint-initdb.d/init.sh

  adminer:
    image: adminer:latest
    container_name: web-db-adminer
    ports:
      - "8888:8080"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres-data-dev: