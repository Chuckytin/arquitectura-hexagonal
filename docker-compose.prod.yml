services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod

  postgres:
    env_file:
      - .env
    environment:
      # Mapeo explícito de variables
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - postgres-data-prod:/var/lib/postgresql
      - ./docker-config/database/init.sh:/docker-entrypoint-initdb.d/init.sh

volumes:
  postgres-data-prod: